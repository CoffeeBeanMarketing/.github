name: Issue
description: Standard issue - type, priority, effort, labels and assignee.
assignees:
  - CoffeeBeanMarketing
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature
        - Enhancement
        - Content update
        - SEO
        - Task / chore
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Urgent (site down / client blocked)
        - P1 - High (this week)
        - P2 - Medium (this sprint)
        - P3 - Low (when there's time)
      default: 2
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - XS - under 1 hour
        - S - half a day
        - M - about 1 day
        - L - 2 to 3 days
        - XL - a week or more
      default: 1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to happen, and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: How we know it's finished.
      placeholder: "- [ ] ..."
